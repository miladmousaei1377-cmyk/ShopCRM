name: Build Android APK

on:
  push:
    branches: [main, master, 'claude/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: نصب Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: نصب وابستگی‌ها
        run: flutter pub get

      - name: تولید کد (drift + riverpod)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: آنالیز کد
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: اجرای تست‌ها
        run: flutter test
        continue-on-error: true

      - name: بیلد APK (split-per-abi برای حجم کمتر)
        run: flutter build apk --debug --split-per-abi --no-tree-shake-icons

      - name: آپلود APK (arm64 — مناسب اکثر گوشی‌های اندروید ۵ سال اخیر)
        uses: actions/upload-artifact@v4
        with:
          name: shopcrm-android-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          retention-days: 30

name: Build Windows EXE

on:
  push:
    branches: [main, master, 'claude/**', 'fix/**']
  pull_request:
    branches: [main, master, 'claude/**']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.0'
  # suppress deprecation error in local_auth_windows (uses experimental/coroutine)
  CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      # ─── ۱. دریافت کد ────────────────────────────────────────────────────────
      - name: دریافت کد
        uses: actions/checkout@v4

      # ─── ۲. نصب Flutter ──────────────────────────────────────────────────────
      - name: نصب Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ─── ۳. فعال‌سازی Windows desktop ────────────────────────────────────────
      - name: فعال‌سازی Windows desktop
        run: flutter config --enable-windows-desktop

      # ─── ۴. نصب وابستگی‌ها ──────────────────────────────────────────────────
      - name: نصب وابستگی‌ها
        run: flutter pub get

      - name: اعمال و بررسی فرمت
        run: |
          dart format .
          dart format --output=none --set-exit-if-changed .

      # ─── ۵. تولید کد خودکار (drift + riverpod) ──────────────────────────────
      - name: تولید کد
        run: dart run build_runner build --delete-conflicting-outputs

      - name: ذخیره خروجی code generation
        uses: actions/upload-artifact@v4
        with:
          name: nexocrm-generated-sources
          path: |
            lib/**/*.dart
            test/**/*.dart
            pubspec.lock
          retention-days: 3

      - name: تحلیل استاتیک
        run: flutter analyze

      - name: اجرای تست‌ها
        run: flutter test

      # ─── ۶. بیلد Release ────────────────────────────────────────────────────
      - name: بیلد Windows (Release)
        run: flutter build windows --release

      - name: ساخت بسته MSIX
        run: dart run msix:create --build-windows false

      # ─── ۷. فشرده‌سازی خروجی ────────────────────────────────────────────────
      - name: فشرده‌سازی خروجی
        shell: powershell
        run: |
          Compress-Archive `
            -Path build\windows\x64\runner\Release\* `
            -DestinationPath nexocrm-windows.zip
          (Get-FileHash nexocrm-windows.zip -Algorithm SHA256).Hash.ToLower() + `
            "  nexocrm-windows.zip" | Set-Content nexocrm-windows.zip.sha256

      # ─── ۸. آپلود ───────────────────────────────────────────────────────────
      - name: آپلود فایل ZIP ویندوز
        uses: actions/upload-artifact@v4
        with:
          name: nexocrm-windows-release
          path: |
            nexocrm-windows.zip
            nexocrm-windows.zip.sha256
            build/windows/msix/*.msix
          retention-days: 30

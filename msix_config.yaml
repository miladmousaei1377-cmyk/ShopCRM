# پیکربندی MSIX برای Windows
# اجرا: flutter pub run msix:create
msix_config:
  display_name: فروشگاه هوشمند
  publisher_display_name: ShopCRM
  identity_name: com.shopcrm.app
  publisher: CN=ShopCRM
  msix_version: 1.0.0.0
  logo_path: assets/icon/app_icon.png

  # قابلیت‌های مورد نیاز Windows
  capabilities: 'internetClient,bluetooth,privateNetworkClientServer'

  # تنظیمات ثبت‌نام
  store: false    # فروش مستقیم، نه از Microsoft Store
  output_path: build/windows/msix
  output_name: ShopCRM-Setup

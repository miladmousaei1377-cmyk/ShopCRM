name: shop_crm
description: فروشگاه هوشمند - سیستم مدیریت فروشگاه
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # مدیریت حالت
  flutter_riverpod: ^2.5.1

  # ناوبری
  go_router: ^13.2.0

  # پایگاه داده محلی
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol

  # شبکه
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1

  # بارکد
  mobile_scanner: ^5.1.1

  # بلوتوث پرینتر
  flutter_blue_plus: ^1.32.12
  esc_pos_utils_plus: ^2.0.1

  # PDF
  pdf: ^3.11.0
  printing: ^5.12.0

  # نمودار
  fl_chart: ^0.68.0

  # تاریخ شمسی
  shamsi_date: ^1.1.0
  persian_datetime_picker: ^3.2.0

  # فونت و استایل
  google_fonts: ^6.2.1

  # ذخیره‌سازی
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # تصویر
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # اعلان
  flutter_local_notifications: ^17.2.2

  # خروجی
  excel: ^4.0.2
  share_plus: ^12.0.2
  window_manager: ^0.5.2

  # احراز هویت بیومتریک
  local_auth: ^2.3.0

  # کمکی
  path_provider: ^2.1.3
  connectivity_plus: ^6.0.3
  intl: ^0.19.0
  uuid: ^4.4.0
  cryptography: ^2.7.0
  image: ^4.2.0
  path: ^1.9.0
  archive: ^3.6.1
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # کد جنریشن
  build_runner: ^2.10.4
  drift_dev: ^2.34.4
  flutter_lints: ^3.0.0
  sqlite3: ^3.5.2

  # آیکون برنامه
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Thin.ttf
          weight: 100
        - asset: assets/fonts/Vazirmatn-Light.ttf
          weight: 300
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Vazirmatn-Black.ttf
          weight: 900

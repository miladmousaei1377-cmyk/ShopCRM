# ─── Docker Compose — فروشگاه هوشمند ──────────────────────────────
# سه سرویس:
#   backend → FastAPI (پورت ۸۰۰۰)
#   db      → PostgreSQL 15
#   nginx   → reverse proxy + SSL

version: "3.9"

services:

  # ─── FastAPI Backend ───────────────────────────────────────────
  backend:
    build: ./backend
    container_name: shop_crm_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://shop:shoppass@db:5432/shopdb
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      - ALLOWED_ORIGINS=*
      - DEBUG=false
    depends_on:
      db:
        condition: service_healthy # صبر می‌کند تا دیتابیس آماده شود

  # ─── PostgreSQL Database ───────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: shop_crm_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=shop
      - POSTGRES_PASSWORD=shoppass
      - POSTGRES_DB=shopdb
    volumes:
      - pg_data:/var/lib/postgresql/data # داده‌ها دائمی هستند
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shopdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Nginx Reverse Proxy ───────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: shop_crm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"   # HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro # گواهی SSL
    depends_on:
      - backend

# ─── Volume‌های دائمی ──────────────────────────────────────────────
volumes:
  pg_data: # داده‌های دیتابیس حتی بعد از restart Docker باقی می‌مانند
